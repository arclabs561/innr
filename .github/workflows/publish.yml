name: Publish innr

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the tested version and tag its commit
        type: boolean
        default: false
      confirm:
        description: Legacy CLI input (leave blank)
        type: string
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Select release mode
        id: mode
        env:
          RELEASE: ${{ inputs.release }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$RELEASE/$CONFIRM" in
            true/|true/publish|false/publish) release=true ;;
            false/|false/dry-run) release=false ;;
            *) echo "::error::Conflicting or unknown release inputs"; exit 1 ;;
          esac
          if [[ "$release" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Select main to publish"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

      - name: Verify the package
        id: package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "innr") | .version')
          cargo publish --dry-run --registry crates-io -p innr
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Verified innr $version at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Tag the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent "innr release workflow ($GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/innr/$VERSION")
          case "$status" in
            404) ;;
            200) echo "::error::innr $VERSION is already published"; exit 1 ;;
            *) echo "::error::crates.io returned HTTP $status"; exit 1 ;;
          esac

          remote_git() { git -c 'credential.helper=!gh auth git-credential' "$@"; }
          ref="refs/tags/v$VERSION"
          if remote_git ls-remote --exit-code origin "$ref" > /dev/null; then
            remote_git fetch --no-tags origin "$ref"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
              echo "::error::$ref points to a different commit"
              exit 1
            fi
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            remote_git push origin "$GITHUB_SHA:$ref"
          fi

  publish:
    needs: [verify, tag]
    concurrency: publish-crates-io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"

      - name: Authenticate (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the verified commit
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --registry crates-io -p innr
