[package]
name = "innr"
version = "0.6.3"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
rust-version = "1.89"
description = "SIMD-accelerated vector similarity primitives with binary, ternary, and scalar quantization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/innr"
documentation = "https://docs.rs/innr"
keywords = ["simd", "vector", "similarity", "dot-product", "cosine"]
categories = ["algorithms", "science"]
publish = true
include = [
    "/src/**/*.rs",
    "/benches/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/Cargo.toml",
    "/LICENSE-*",
    "/README.md",
]

[workspace]

[package.metadata.docs.rs]
# Build with every feature so sparse_ext and the anndists impls are
# visible on docs.rs (they are README-advertised).
all-features = true

[features]
default = []
# Runtime-dispatched SIMD kernels (AVX-512, AVX2+FMA, NEON, WASM SIMD128) via
# fearless_simd. Without it innr is dependency-free and uses the portable
# kernels, which LLVM auto-vectorizes for the compile target.
simd = ["dep:fearless_simd"]
sparse = []
# Implements anndists::dist::Distance for the metric types in `distance`,
# making them usable directly as hnsw_rs distances (hnsw_rs binds to
# anndists's trait). Off by default to keep interop dependencies opt-in.
anndists = ["dep:anndists"]

[dependencies]
# With default features off, core operations need only std.
# anndists is opt-in interop; see the `anndists` feature above.
anndists = { version = "0.1.5", optional = true }
# Safe SIMD with runtime dispatch. innr uses only its safe portable vector
# types and `Simd::vectorize`, so no `unsafe` expands into this crate.
fearless_simd = { version = "1.2", optional = true }

[dev-dependencies]
# Tests run the SIMD kernels on fearless_simd's scalar `Fallback` level too,
# which this feature makes constructible on every target.
fearless_simd = { version = "1.2", features = ["force_support_fallback"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
qntz = { version = "0.2.1", features = ["rabitq"] }
rand = "0.9"
# Proves the anndists feature against the real consumer (tests/anndists_interop.rs).
hnsw_rs = "0.3"

[[example]]
name = "maxsim_colbert"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "dense"
harness = false

[[bench]]
name = "dense_f64"
harness = false

[[bench]]
name = "sparse"
harness = false

[[bench]]
name = "maxsim"
harness = false

[[bench]]
name = "ternary"
harness = false

[[bench]]
name = "batch"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
