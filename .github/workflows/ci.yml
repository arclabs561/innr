# Diagnostic-only branch. Do not merge this replacement workflow.
name: CI

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  paired-fast-cosine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      CARGO_NET_RETRY: "10"
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.99.0"
      - name: Compiler and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          lscpu
      - name: Compare original and token-port fast cosine
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/paired-fast-cosine.py
